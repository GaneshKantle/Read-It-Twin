<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Read faster. Understand more. Challenge a friend. Read It Twin scores speed and comprehension together."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16133a" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Read It Twin" />
    <meta property="og:title" content="Read It Twin" />
    <meta
      property="og:description"
      content="Read faster. Understand more. Challenge a friend."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Read It Twin" />
    <meta
      name="twitter:description"
      content="Read faster. Understand more. Challenge a friend."
    />
    <script>
      (() => {
        const storageKey = 'readit-theme';
        const stored = window.localStorage.getItem(storageKey);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Read It Twin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
